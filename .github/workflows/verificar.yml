name: Verificar inventario

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run tipos
      - run: npm test
      - run: npx expo install --check
      - run: npx expo export --platform android --platform ios --output-dir dist
